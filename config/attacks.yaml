attacks:

  # ── Basic Attacks ──────────────────────────────────────────────────────────

  - id: spoof-meter-001
    category: basic
    type: spoofing
    target: meter-001
    description: "meter-001: voltage spoofing ±50%"
    info: "False data injection. The attacker feeds fabricated voltage and current back to the control system, so operators act on a grid that isn't there and overloads or developing faults stay hidden. Well documented in the literature since 2009, and seen in real intrusions as a warm-up to physical disruption."
    params:
      max_deviation: 50

  - id: spoof-meter-002
    category: basic
    type: spoofing
    target: meter-002
    description: "meter-002: voltage spoofing ±50%"
    info: "Spoof a second meter and the false picture becomes internally consistent, so checking one reading against another stops catching it."
    params:
      max_deviation: 50

  - id: spoof-inverter-001
    category: basic
    type: spoofing
    target: inverter-001
    description: "inverter-001: output spoofing ±80%"
    info: "Falsified inverter output. Lie about how much solar is really on the system and the grid dispatches the wrong amount of backup generation."
    params:
      max_deviation: 80

  - id: shutdown-ev-001
    category: basic
    type: shutdown
    target: ev-charger-001
    description: "ev-charger-001: forced shutdown"
    info: "Forced shutdown via a spoofed stop command. In April 2022 chargers along a UK motorway were remotely disabled, and Israeli public chargers were hijacked the same year. Neither needed authentication to accept the stop."
    params: {}

  - id: shutdown-ev-002
    category: basic
    type: shutdown
    target: ev-charger-002
    description: "ev-charger-002: forced shutdown"
    info: "A second charger dropped at the same moment. Kill enough at once and the sudden loss of load pushes local frequency around, worst where EVs make up a big share of peak demand."
    params: {}

  - id: demand-spike-meter-001
    category: basic
    type: demand_spike
    target: meter-001
    description: "meter-001: demand spike 6×"
    info: "Load spiking. Report a wildly inflated demand and the energy management system over-dispatches generation; the resulting surge can trip protection relays and cause local faults. The literature calls this MaDIoT, manipulation of demand via IoT."
    params:
      multiplier: 6.0

  - id: demand-spike-ev-001
    category: basic
    type: demand_spike
    target: ev-charger-001
    description: "ev-charger-001: demand spike 10× (200 kW)"
    info: "One charger claiming 200 kW, ten times its real draw. Princeton researchers showed in 2021 that coordinating enough high-wattage devices this way can destabilise a regional grid without touching any utility system."
    params:
      multiplier: 10.0

  - id: demand-spike-substation-01
    category: basic
    type: demand_spike
    target: substation-01
    description: "substation-01: load spike 4×"
    info: "A 4x load spike at the substation. If the management system trusts it and dispatches to match, the gap between real and reported load can trip neighbouring equipment."
    params:
      multiplier: 4.0

  - id: frequency-attack-001
    category: basic
    type: frequency_attack
    target: meter-001
    description: "meter-001: frequency drop to 47.5 Hz (under-frequency)"
    info: "Frequency is the grid's heartbeat; Europe runs at 50 Hz. Drop it to 47.5 and under-frequency relays start shedding whole blocks of customers to head off a collapse. There have been big continent-scale blackouts that kicked off pretty much like this."
    params:
      target_frequency: 47.5

  - id: frequency-attack-002
    category: basic
    type: frequency_attack
    target: meter-002
    description: "meter-002: frequency spike to 52.8 Hz (over-frequency)"
    info: "Push frequency the other way to 52.8 Hz and generators trip offline to protect their turbines, pulling supply and driving a collapse in the opposite direction. Both directions are reachable through demand manipulation alone."
    params:
      target_frequency: 52.8

  - id: cascade-substation-01
    category: basic
    type: cascading_failure
    target: substation-01
    description: "substation-01: cascading failure"
    info: "Cascading failure: one substation trips, its load lands on neighbours, they overload and trip in turn. The 2003 Northeast blackout, 55 million people, started with a software bug and a tree touching a single line. The cascade finished in nine seconds."
    params:
      probability: 0.8

  - id: cascade-substation-02
    category: basic
    type: cascading_failure
    target: substation-02
    description: "substation-02: cascading failure"
    info: "The same failure on the second substation. Lose both close together and every downstream device goes dark, which is what the homes-affected counter reflects. Not as cinematic as the Aurora generator test at INL, but the propagation logic is the same and the fault definately outruns the operator."
    params:
      probability: 0.8

  - id: modbus-substation-01
    category: basic
    type: modbus_write
    target: substation-01
    description: "substation-01: Modbus write: zero load setpoint"
    info: "Modbus is a 1979 protocol with no authentication, so anything on the segment can write any register. Reach the substation controller and you can zero the load setpoint directly. Modbus TCP was still sitting on internet-exposed systems as of 2024."
    params:
      register: load_mw
      value: 0.0

  - id: modbus-substation-02
    category: basic
    type: modbus_write
    target: substation-02
    description: "substation-02: Modbus write: zero load setpoint"
    info: "A second Modbus write. Hitting both at once is what FrostyGoop did in Lviv in January 2024, zeroing heating setpoints across the city with nothing more than network access and the register map."
    params:
      register: load_mw
      value: 0.0

  - id: replay-meter-003
    category: basic
    type: replay
    target: meter-003
    description: "meter-003: data freeze / replay (stale readings)"
    info: "Replay: capture a stretch of normal readings and loop them, so the control room sees a calm grid while the real one drifts underneath. Every serious ICS intrusion on record has masked data this way during the dwell, from Stuxnet to Industroyer to Volt Typhoon."
    params: {}

  - id: replay-substation-02
    category: basic
    type: replay
    target: substation-02
    description: "substation-02: data freeze / replay"
    info: "Replayed substation telemetry. Watch the dashboard while it runs and every readout looks fine; the attack stays invisible until the phase-2 strike lands and the real state snaps back."
    params: {}


  # ── Nation-State Techniques ────────────────────────────────────────────────

  # Coordinated simultaneous strike, Ukraine 2015 style
  - id: nation-coordinated-blackout
    category: nation-state
    type: coordinated
    target: _meta
    description: "Ukraine 2015 style: both substations hit simultaneously"
    info: "Ukraine, December 2015. Sandworm, a Russian military intelligence unit, cut power to 230,000 people across three utilities at once. They had been in the networks for six months off a phishing email, learning the topology. On the day, operators watched their own cursors open breakers as the attackers drove the workstations remotely."
    params:
      attacks:
        - cascade-substation-01
        - cascade-substation-02

  - id: nation-coordinated-spoofing
    category: nation-state
    type: coordinated
    target: _meta
    description: "Mass telemetry spoofing: all meters simultaneously"
    info: "Poison every measurement point at once and there is no clean reading left to check against. This is the blinding phase from Industroyer and Volt Typhoon: keep operators looking at a normal grid while you move into position."
    params:
      attacks:
        - spoof-meter-001
        - spoof-meter-002
        - replay-meter-003

  # Long dwell → sudden execution, Industroyer / Sandworm style
  - id: nation-staged-industroyer
    category: nation-state
    type: staged
    target: _meta
    description: "Industroyer style: 30s silent replay, then coordinated blackout"
    info: "Industroyer (Ukraine, 2016) and Industroyer2 (2022) ran the same play: a quiet dwell to learn the grid and hide, then a sudden coordinated strike. Industroyer was the first grid-specific malware since Stuxnet, and both are attributed to Sandworm."
    params:
      phase_1:
        duration: 30
        attack_ids:
          - replay-meter-003
          - replay-substation-02
      phase_2:
        attack_ids:
          - cascade-substation-01
          - cascade-substation-02

  - id: nation-staged-slow-burn
    category: nation-state
    type: staged
    target: _meta
    description: "Slow burn: 20s spoofing masks access, then demand spike triggers overload"
    info: "Spoof first, overload second. The meters report normal while the attacker lines up a demand spike; by the time it hits, operators have been reading false data for 20 seconds and have no real baseline to react from."
    params:
      phase_1:
        duration: 20
        attack_ids:
          - spoof-meter-001
          - spoof-meter-002
      phase_2:
        attack_ids:
          - demand-spike-substation-01
          - demand-spike-ev-001

  # Protection relay bypass, Industroyer/Crashoverride style
  - id: nation-relay-bypass-01
    category: nation-state
    type: relay_bypass
    target: substation-01
    description: "substation-01: protection relay disabled (Industroyer style)"
    info: "Protection relays are the grid's automatic breakers: they spot a fault and isolate it before it spreads. Industroyer disabled them before sending bad switching commands, so nothing automatic could intervene. With the relay off, the next fault just propogates. The Aurora test at Idaho National Laboratory in 2007 is the canonical demo of what happens when protection cannot step in: the machine tears itself apart in seconds."
    params: {}

  - id: nation-relay-bypass-02
    category: nation-state
    type: relay_bypass
    target: substation-02
    description: "substation-02: protection relay disabled"
    info: "Bypass on the second substation. With both relays down the grid has no automatic defence, and any downstream cascade, spike or thermal event runs without the usual isolation."
    params: {}

  # Safety system bypass, Triton/TRISIS style
  - id: nation-safety-bypass-01
    category: nation-state
    type: safety_bypass
    target: substation-01
    description: "substation-01: SIS taken offline (Triton/TRISIS style)"
    info: "Triton/TRISIS (a Saudi petrochemical plant, 2017) was the first malware built to attack Safety Instrumented Systems, the last automatic line against physical catastrophe. Take the SIS offline and no safe-state shutdown fires even when sensors detect danger. A bug in the malware tripped that shutdown itself and exposed the operation before it could cause an explosion."
    params: {}

  - id: nation-safety-bypass-02
    category: nation-state
    type: safety_bypass
    target: substation-02
    description: "substation-02: SIS taken offline"
    info: "SIS bypass on the second substation. With both offline there is no automated protection anywhere, so a fault, overload or thermal event runs to its physical end. This is the precondition every worst-case ICS scenario depends on."
    params: {}

  # Anti-forensics / wiper, Industroyer2 / CaddyWiper style
  - id: nation-wiper-substation-01
    category: nation-state
    type: wiper
    target: substation-01
    description: "substation-01: log/config wipe, device goes dark (Industroyer2 style)"
    info: "Industroyer2 (Ukraine, April 2022) carried the CaddyWiper malware to destroy the ICS hosts after the power cut, taking logs, configs and firmware with it. Two payoffs: slower restoration, because the config needed to bring gear back is gone, and a much harder forensic trail."
    params: {}

  - id: nation-wiper-substation-02
    category: nation-state
    type: wiper
    target: substation-02
    description: "substation-02: log/config wipe"
    info: "Wiper on the second substation. Wipe both and recovery means physical access, manual reconfiguration, maybe new hardware. Ukraine still restored power within hours in 2022, partly because they had drilled manual switching after 2015 and 2016."
    params: {}

  - id: nation-wiper-all-substations
    category: nation-state
    type: coordinated
    target: _meta
    description: "Mass wipe: both substations wiped, all connected devices lose grid (Industroyer2 style)"
    info: "Both substations wiped at once, Industroyer2-style. Everything downstream loses supply immediately and each site needs hands-on recovery. The wipe also destroys the forensic evidence, which is the point."
    params:
      attacks:
        - nation-wiper-substation-01
        - nation-wiper-substation-02

  # ── Stuxnet 2010: Iran Natanz ─────────────────────────────────────────────
  # Slow physical destruction: falsify cooling setpoints, overheat transformer,
  # trip thermal protection. Operators see nothing until the equipment fails.

  - id: nation-stuxnet-substation-01
    category: nation-state
    type: thermal_stress
    target: substation-01
    description: "Stuxnet style: substation-01 transformer overheating (2°C/tick, trips at 112°C)"
    info: "Stuxnet (Iran, 2010) sat inside Natanz for over a year, spinning centrifuges past their limits while reporting normal readings. The transformer version: falsify the cooling setpoints so it slowly overheats while the control room sees nothing wrong. The equipment fails and nobody knows why. Attributed to US and Israeli intelligence."
    params:
      rate: 2.0
      trip_threshold: 112.0

  - id: nation-stuxnet-substation-02
    category: nation-state
    type: thermal_stress
    target: substation-02
    description: "Stuxnet style: substation-02 transformer overheating"
    info: "The same thermal attack on the second transformer. The orange dashed line on the substation chart is the temperature climbing; load looks normal right up to the thermal trip. That gap is what makes Stuxnet-class attacks so hard to catch."
    params:
      rate: 2.0
      trip_threshold: 112.0

  - id: nation-stuxnet-both
    category: nation-state
    type: coordinated
    target: _meta
    description: "Stuxnet style: both substations slowly overheating simultaneously"
    info: "Both transformers cooking at once. Stuxnet hit roughly 1,000 centrifuges at Natanz and cut Iran's enrichment by an estimated 20% over a year, before a Belarusian firm stumbled onto it in June 2010 while chasing an unrelated customer complaint."
    params:
      attacks:
        - nation-stuxnet-substation-01
        - nation-stuxnet-substation-02

  # ── Volt Typhoon 2023, Chinese APT, US critical infrastructure ────────────
  # Long-term living-off-the-land: months of silent access, then coordinated
  # strike. 120s silent dwell (all devices replaying stale data), then blackout.

  - id: nation-volt-typhoon
    category: nation-state
    type: staged
    target: _meta
    description: "Volt Typhoon: 120s silent dwell (stale data masks access), then total blackout"
    info: "Volt Typhoon is a Chinese state group the US assesses has been sitting quietly inside American critical infrastructure for years, not to spy but to be ready to disrupt during a future crisis such as one over Taiwan. They live off the land and leave no malware to find. Microsoft flagged them in May 2023; the US said they were still in the networks in January 2024."
    params:
      phase_1:
        duration: 120
        attack_ids:
          - replay-meter-003
          - replay-substation-02
          - spoof-meter-001
          - spoof-meter-002
      phase_2:
        attack_ids:
          - cascade-substation-01
          - cascade-substation-02
          - nation-wiper-substation-01
          - nation-wiper-substation-02

  # ── FrostyGoop 2024, Lviv, Ukraine heating utility ───────────────────────
  # Modbus TCP direct writes to heating controllers in January.
  # 600 apartment buildings lost heat. No wiper, purely Modbus native commands.

  - id: nation-frostygoop
    category: nation-state
    type: coordinated
    target: _meta
    description: "FrostyGoop 2024: Modbus writes zero all load setpoints, heating fails (Lviv style)"
    info: "FrostyGoop (Lviv, January 2024). Attackers spoke Modbus TCP straight to a heating company's controllers, zeroed the setpoints and cut heat to 600 apartment buildings mid-winter. No specialist exploit, just the controllers' own protocol. Ukraine's CERT attributed it to Russia."
    params:
      attacks:
        - modbus-substation-01
        - modbus-substation-02
        - demand-spike-substation-01

  # ── Pipedream / INCONTROLLER 2022: Most advanced ICS framework discovered
  # Targeted Schneider Electric & OMRON PLCs. Full grid compromise:
  # enumerate, spoof, spike demand, then simultaneous total shutdown with wiper.

  - id: nation-pipedream
    category: nation-state
    type: staged
    target: _meta
    description: "Pipedream 2022: recon phase (spoofing + demand spike), then total grid wipe"
    info: "PIPEDREAM/INCONTROLLER (2022) was the most capable ICS attack framework found in the open, built to hit Schneider Electric and OMRON PLCs across energy, water and manufacturing. It was caught before deployment: Dragos, Mandiant and the US government disclosed it early. Attributed to a Russian actor. Launched, it could have done physical damage across several sectors at once."
    params:
      phase_1:
        duration: 45
        attack_ids:
          - spoof-meter-001
          - spoof-meter-002
          - spoof-inverter-001
          - demand-spike-substation-01
          - frequency-attack-001
      phase_2:
        attack_ids:
          - nation-wiper-substation-01
          - nation-wiper-substation-02
          - shutdown-ev-001
          - shutdown-ev-002

  # ── Colonial Pipeline 2021 ─────────────────────────────────────────────────
  # Ransomware on IT network caused operator-initiated OT shutdown out of caution.
  # No direct OT attack, but operational consequence was identical to a cyberattack.

  - id: nation-colonial-pipeline
    category: nation-state
    type: coordinated
    target: _meta
    description: "Colonial Pipeline style: ransomware encrypts all devices, OT shutdown"
    info: "Colonial Pipeline (May 2021). DarkSide ransomware hit the IT and billing systems; the pipeline controls were never touched. Colonial shut the line down themselves, not knowing how far the attackers had reached. The US East Coast lost 45% of its fuel for six days and stations ran dry. Colonial paid $4.4M; the FBI later recovered $2.3M from the attackers' wallet."
    params:
      attacks:
        - type: ransomware
          target: substation-01
        - type: ransomware
          target: substation-02

  # ── Aurora Vulnerability 2007: Idaho National Laboratory ──────────────────
  # First public proof-of-concept that cyber could physically destroy rotating equipment.
  # Rapid open/close of a generator breaker out of phase with the grid causes the rotor
  # to violently slam against its housing. Destroyed a 2.25 MW generator on camera in 2007.

  - id: aurora-inverter-001
    category: nation-state
    type: aurora
    target: inverter-001
    description: "inverter-001, Aurora 2007: out-of-phase breaker cycling → violent oscillation → physical destruction"
    info: "The Aurora Generator Test (Idaho National Laboratory, 2007) was the first public proof that code could physically wreck rotating equipment. Snap a generator's breaker open and shut out of phase with the grid and each reconnection throws the rotor against its housing. The test destroyed a 2.25 MW diesel generator in 21 seconds, on camera. It affects any synchronous generator on the grid and has never been fully fixed."
    params: {}

  - id: aurora-inverter-002
    category: nation-state
    type: aurora
    target: inverter-002
    description: "inverter-002, Aurora attack: rapid reconnection surge → generator trip"
    info: "Aurora on the second generator. INL researchers found it and told the US government in 2007; a redacted clip leaked to CNN that year, the first public footage of cyber-physical destruction. The real fix is hardware, an out-of-step protection relay, not a patch."
    params: {}

  - id: aurora-both
    category: nation-state
    type: coordinated
    target: _meta
    description: "Aurora 2007, simultaneous out-of-phase attack on both generators (Idaho National Lab)"
    info: "Both generators hit at once. The 2007 test used one; an attacker with access to several could destroy them together and strip out all local generation in seconds. NERC issued an Aurora protection standard in 2012, though compliance is patchy."
    params:
      attacks:
        - aurora-inverter-001
        - aurora-inverter-002

  # ── Predatory Sparrow / Gonjeshke Darande 2022, Iranian steel mills ───────
  # Attributed to Israeli-linked hacktivist group. Attacked three Iranian steel mills
  # simultaneously. Caused fire at Khuzestan Steel. OT sabotage: overloaded equipment
  # with SIS disabled so automatic protection could not respond.

  - id: predatory-sparrow
    category: nation-state
    type: staged
    target: _meta
    description: "Predatory Sparrow 2022: disable SIS, then thermal+demand overload causes equipment fire (Iranian steel mill style)"
    info: "Predatory Sparrow (Gonjeshke Darande) hit three Iranian steel mills simultaneously in June 2022 and released video of a fire at Khuzestan Steel. They disabled the safety systems first, then overloaded the equipment so it could not protect itself. Widely linked to Israel, never officially attributed, and one of the few confirmed cyber attacks to cause visible physical damage since Stuxnet."
    params:
      phase_1:
        duration: 15
        attack_ids:
          - nation-safety-bypass-01
          - nation-stuxnet-substation-01
      phase_2:
        attack_ids:
          - demand-spike-substation-01
          - cascade-substation-01

  # ── Triton / TRISIS Full Kill Chain 2017, Tasnee, Saudi Arabia ─────────────
  # Safety system bypass followed by deliberate process fault: what the attackers
  # intended before a logic error triggered a safe-state shutdown and exposed the malware.
  # Full sequence: SIS offline → create dangerous condition → no automatic recovery.

  - id: triton-full-kill-chain
    category: nation-state
    type: staged
    target: _meta
    description: "Triton/TRISIS full kill chain: SIS disabled on both substations, then simultaneous cascading fault with no protection"
    info: "Triton/TRISIS (a Saudi petrochemical plant, 2017), the first malware built to attack Safety Instrumented Systems. The intended sequence: take the SIS offline, then deliberately create the dangerous condition the SIS would have caught. A bug tripped a safe-state shutdown and blew their cover before they could cause an explosion. FireEye tied it to a Russian government research institute in 2018, and it is widely rated the most dangerous ICS malware yet built."
    params:
      phase_1:
        duration: 20
        attack_ids:
          - nation-safety-bypass-01
          - nation-safety-bypass-02
      phase_2:
        attack_ids:
          - cascade-substation-01
          - cascade-substation-02
